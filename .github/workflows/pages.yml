name: Publish clinic website
on:
  push:
    branches: [main]
    paths: ['dist/**', 'content/**', 'scripts/build_content.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: clinic-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build health hub and blog
        run: python3 scripts/build_content.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
